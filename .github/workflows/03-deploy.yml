# ═══════════════════════════════════════════════════════════════════════
# Auto Deployment — Do kploy VPS (zero-downtime strategy)
# ═══════════════════════════════════════════════════════════════════════
# Deploys to Dokploy-managed VPS via SSH.
#   - develop/staging branch → staging deployment
#   - main branch → production deployment
#   - Uses rolling update strategy for zero downtime
# ═══════════════════════════════════════════════════════════════════════

name: Deploy

on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types: [completed]
    branches: [main, develop, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      tag:
        description: "Image tag to deploy (default: latest or branch)"
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # For production (main branch)
  PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
  PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
  PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
  PROD_FRONTEND_SERVICE: ${{ secrets.PROD_FRONTEND_SERVICE || 'student-alumni-frontend' }}
  PROD_BACKEND_SERVICE: ${{ secrets.PROD_BACKEND_SERVICE || 'student-alumni-backend' }}

  # For staging (develop/staging branch)
  STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST || secrets.PROD_SSH_HOST }}
  STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER || secrets.PROD_SSH_USER }}
  STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY || secrets.PROD_SSH_KEY }}

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]] || [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "SSH_HOST=$PROD_SSH_HOST" >> "$GITHUB_OUTPUT"
            echo "SSH_USER=$PROD_SSH_USER" >> "$GITHUB_OUTPUT"
            echo "FRONTEND_SERVICE=$PROD_FRONTEND_SERVICE" >> "$GITHUB_OUTPUT"
            echo "BACKEND_SERVICE=$PROD_BACKEND_SERVICE" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "SSH_HOST=$STAGING_SSH_HOST" >> "$GITHUB_OUTPUT"
            echo "SSH_USER=$STAGING_SSH_USER" >> "$GITHUB_OUTPUT"
            echo "FRONTEND_SERVICE=staging-frontend" >> "$GITHUB_OUTPUT"
            echo "BACKEND_SERVICE=staging-backend" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine image tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ steps.env.outputs.SSH_KEY }}
          known_hosts: ${{ steps.env.outputs.SSH_HOST }}
          if_key_exists: replace

      - name: Add host to known_hosts
        run: |
          ssh-keyscan -H ${{ steps.env.outputs.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Dokploy VPS
        run: |
          SSH_HOST="${{ steps.env.outputs.SSH_HOST }}"
          SSH_USER="${{ steps.env.outputs.SSH_USER }}"
          TAG="${{ steps.tag.outputs.tag }}"
          FRONTEND="${{ steps.env.outputs.FRONTEND_SERVICE }}"
          BACKEND="${{ steps.env.outputs.BACKEND_SERVICE }}"
          ENV="${{ steps.env.outputs.environment }}"

          echo "🚀 Deploying $ENV environment"
          echo "   Host: $SSH_HOST"
          echo "   Tag: $TAG"
          echo "   Frontend: $FRONTEND"
          echo "   Backend: $BACKEND"

          ssh "$SSH_USER@$SSH_HOST" bash -s << 'DEPLOYSCRIPT'
            set -e

            ENV="{{ ENV }}"
            TAG="{{ TAG }}"
            REGISTRY="ghcr.io/{{ github.repository }}"

            echo "📥 Pulling latest images..."
            docker pull "$REGISTRY/frontend:$TAG" || echo "Frontend image not found, skipping"
            docker pull "$REGISTRY/backend:$TAG" || echo "Backend image not found, skipping"

            echo "🔄 Updating Dokploy services..."
            if docker service ls 2>/dev/null | grep -q "student-alumni-frontend"; then
              docker service update --image "$REGISTRY/frontend:$TAG" student-alumni-frontend-yefvun || true
            fi
            if docker service ls 2>/dev/null | grep -q "student-alumni-backend"; then
              docker service update --image "$REGISTRY/backend:$TAG" student-alumni-backend-aompqa || true
            fi

            echo "⏳ Waiting for services to stabilize..."
            sleep 10

            echo "✅ Health checks..."
            curl -fsS https://studentalumni.ai/api/health && echo " Backend OK" || echo " Backend check failed"
            curl -fsS https://studentalumni.ai/healthz && echo " Frontend OK" || echo " Frontend check failed"

            echo "🏁 Deployment complete"
DEPLOYSCRIPT

      - name: Post-deploy health check
        run: |
          sleep 5
          echo "🔍 Running health checks..."
          curl -fsS -o /dev/null -w "%{http_code}" https://studentalumni.ai/api/health && echo " Backend healthy" || echo "⚠️ Backend unhealthy"
          curl -fsS -o /dev/null -w "%{http_code}" https://studentalumni.ai/healthz && echo " Frontend healthy" || echo "⚠️ Frontend unhealthy"

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 Deployment FAILED for ${{ github.repository }} on ${{ github.ref_name }}"
            }
        continue-on-error: true

      - name: Summary
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Detail | Value |"
            echo "|---|---|"
            echo "| Environment | ${{ steps.env.outputs.environment }} |"
            echo "| Image Tag | ${{ steps.tag.outputs.tag }} |"
            echo "| Host | ${{ steps.env.outputs.SSH_HOST }} |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"
