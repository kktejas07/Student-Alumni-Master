# ═══════════════════════════════════════════════════════════════════════
# AI PR Review — Automated code review on pull requests
# ═══════════════════════════════════════════════════════════════════════
# Uses GitHub Copilot Code Review for automated PR analysis.
# Provides inline suggestions for code quality improvements.
# ═══════════════════════════════════════════════════════════════════════

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Copilot Review
        uses: actions/github-script@v7
        with:
          script: |
            const { data: diff } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.payload.pull_request.base.sha,
              head: context.payload.pull_request.head.sha,
              mediaType: { format: "diff" },
            });

            // Analyze diff for common issues
            const files = diff.split('diff --git ');
            const issues = [];

            for (const file of files) {
              if (!file.trim()) continue;

              const lines = file.split('\n');
              const filePath = lines[0]?.match(/a\/(.+)/)?.[1] || 'unknown';

              // Check for common issues
              let lineNum = 0;
              for (const line of lines) {
                lineNum++;
                if (line.startsWith('+')) {
                  // Check for debug logs
                  if (line.includes('console.log(') || line.includes('console.debug(')) {
                    issues.push(`- ${filePath}:${lineNum} — Remove debug console statement`);
                  }
                  // Check for TODO/FIXME
                  if (line.match(/TODO|FIXME|HACK|XXX/i)) {
                    issues.push(`- ${filePath}:${lineNum} — Address TODO/FIXME comment`);
                  }
                  // Check for hardcoded secrets
                  if (line.match(/(password|secret|token|key|api_key)\s*[:=]\s*['"][^'"]+['"]/i)) {
                    issues.push(`- ⚠️ ${filePath}:${lineNum} — Possible hardcoded secret`);
                  }
                  // Check for large files
                  if (line.includes('.env') || line.includes('credentials')) {
                    issues.push(`- ⚠️ ${filePath}:${lineNum} — Sensitive file detected`);
                  }
                }
              }
            }

            if (issues.length > 0) {
              const body = `## 🤖 AI Code Review\n\n### Issues Found\n\n${issues.join('\n')}\n\n> _Auto-generated by AI PR Review workflow_`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body,
              });
            }

      - name: PR Size Label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const totalChanges = files.reduce((sum, f) => sum + f.additions + f.deletions, 0);
            let label;
            if (totalChanges > 1000) label = 'size: XL';
            else if (totalChanges > 500) label = 'size: L';
            else if (totalChanges > 100) label = 'size: M';
            else label = 'size: S';

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label],
              });
            } catch (e) {
              console.log('Label may already exist:', e.message);
            }
