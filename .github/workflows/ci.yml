name: CI

# ────────────────────────────────────────────────────────────────────
# What this does
# ────────────────────────────────────────────────────────────────────
# Runs four parallel jobs on every push and pull request:
#
#   1. backend-lint   → ruff syntax / undefined-name checks
#   2. backend-smoke  → pip install + import server.py cleanly
#   3. frontend       → yarn install + eslint + TypeScript check
#   4. docker         → build both production Dockerfiles (no push)
#
# All jobs fail-fast independently. Warnings are non-blocking.
# ────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - "fix-*"
      - "feat-*"
      - "UI-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push lands
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ╔══════════════════════════════════════════════════════════════╗
  # ║  Backend — ruff lint + import smoke test                   ║
  # ╚══════════════════════════════════════════════════════════════╝
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check . \
            --select=E9,F63,F7,F82 \
            --statistics

  backend-smoke:
    name: Backend Import Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      AGENT_K_SCHEDULER_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke test
        working-directory: backend
        run: |
          python -c "import server; print('✓ server.py imports cleanly')"

  # ╔══════════════════════════════════════════════════════════════╗
  # ║  Frontend — eslint + TypeScript check                      ║
  # ╚══════════════════════════════════════════════════════════════╝
  frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: ESLint
        run: |
          yarn lint --max-warnings=999 || {
            echo "::warning::ESLint reported issues (non-blocking)"
            true
          }

      - name: TypeScript check
        run: |
          npx tsc --noEmit --pretty || {
            echo "::warning::TypeScript reported issues (non-blocking)"
            true
          }

  # ╔══════════════════════════════════════════════════════════════╗
  # ║  Docker — verify both production images build                ║
  # ╚══════════════════════════════════════════════════════════════╝
  docker-backend:
    name: Docker Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: studentalumni-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  docker-frontend:
    name: Docker Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: Dockerfile.frontend
          push: false
          tags: studentalumni-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ╔══════════════════════════════════════════════════════════════╗
  # ║  Summary — single status line for branch protection rules    ║
  # ╚══════════════════════════════════════════════════════════════╝
  ci-status:
    name: CI Status
    if: always()
    needs:
      - backend-lint
      - backend-smoke
      - frontend
      - docker-backend
      - docker-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Backend Lint  | ${{ needs.backend-lint.result }} |"
            echo "| Backend Smoke | ${{ needs.backend-smoke.result }} |"
            echo "| Frontend      | ${{ needs.frontend.result }} |"
            echo "| Docker Backend | ${{ needs.docker-backend.result }} |"
            echo "| Docker Frontend | ${{ needs.docker-frontend.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.backend-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-smoke.result }}" == "failure" ]] || \
             [[ "${{ needs.docker-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.docker-frontend.result }}" == "failure" ]]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi
          echo "✅ All required CI jobs passed"
