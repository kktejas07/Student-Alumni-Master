name: CI — Test & Build

# ────────────────────────────────────────────────────────────────────
# What this does
# ────────────────────────────────────────────────────────────────────
# Runs three parallel jobs on every push and every pull request:
#
#   1. backend   → ruff lint + pytest (with a MongoDB service container)
#   2. frontend  → eslint + TypeScript check + jest (optional)
#   3. docker    → builds both production Dockerfiles (no push)
#                  so we catch breakage before Dokploy redeploys
#
# All jobs fail-fast independently. Backend + Docker jobs cache pip
# wheels; Frontend caches Yarn so subsequent CI runs are fast.
# ────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push lands
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ────────────────────────────────────────────────────────────────────
# Defaults: shell + working dir
# ────────────────────────────────────────────────────────────────────
defaults:
  run:
    shell: bash

jobs:
  # ╔══════════════════════════════════════════════════════════════╗
  # ║  Backend — ruff lint + pytest w/ MongoDB service container   ║
  # ╚══════════════════════════════════════════════════════════════╝
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # Spin up a real MongoDB so integration-style tests have a live DB
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Backend reads these via load_dotenv() / os.getenv()
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: student_alumni_ci
      JWT_SECRET: ci-test-secret-not-for-prod
      CORS_ORIGINS: "*"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Disable the APScheduler cron daemon during CI (don't need timers)
      AGENT_K_SCHEDULER_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Tooling not in requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx

      - name: Lint (ruff)
        working-directory: backend
        run: |
          # Hard-fail on syntax/undefined errors; warnings are non-blocking
          ruff check . \
            --select=E9,F63,F7,F82 \
            --statistics
          # Soft pass: full check (won't fail build, surfaces issues)
          ruff check . --exit-zero --statistics || true

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..30}; do
            if (echo "ping" | nc -z localhost 27017) 2>/dev/null; then
              echo "✓ Mongo reachable on :27017"
              break
            fi
            echo "… waiting for mongo ($i/30)"
            sleep 1
          done

      - name: Backend import smoke test
        working-directory: backend
        run: |
          python -c "import server; print('✓ server.py imports cleanly')"

      - name: Run pytest (unit + integration)
        working-directory: backend
        run: |
          # Only the curated `test_*.py` pytest suite — the ad-hoc
          # `backend_test_*.py` integration scripts run separately as
          # smoke checks against a deployed env.
          pytest tests/ \
            -v \
            --tb=short \
            --maxfail=5 \
            --color=yes \
            -p no:cacheprovider

      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-logs
          path: backend/.pytest_cache/
          retention-days: 7
          if-no-files-found: ignore

  # ╔══════════════════════════════════════════════════════════════╗
  # ║  Frontend — eslint + tsc --noEmit + jest                     ║
  # ╚══════════════════════════════════════════════════════════════╝
  frontend:
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: ESLint (expo lint)
        run: |
          # `expo lint` wraps eslint with the Expo config
          yarn lint --max-warnings=999 || {
            echo "::warning::ESLint reported issues. Build continues."
            true
          }

      - name: TypeScript check (tsc --noEmit)
        run: |
          npx tsc --noEmit --pretty

      - name: Run Jest tests
        run: |
          if [ -d __tests__ ] || find . -maxdepth 3 -name "*.test.ts*" -o -name "*.test.js*" 2>/dev/null | grep -q .; then
            yarn test --ci --passWithNoTests --watchAll=false
          else
            echo "ℹ️  No Jest tests found — skipping"
          fi

  # ╔══════════════════════════════════════════════════════════════╗
  # ║  Docker — verify both production images build                ║
  # ╚══════════════════════════════════════════════════════════════╝
  docker:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: false
          tags: studentalumni-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          tags: studentalumni-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ╔══════════════════════════════════════════════════════════════╗
  # ║  Summary — single status line for branch protection rules    ║
  # ╚══════════════════════════════════════════════════════════════╝
  ci-status:
    name: CI Status
    if: always()
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Backend  | ${{ needs.backend.result }} |"
            echo "| Frontend | ${{ needs.frontend.result }} |"
            echo "| Docker   | ${{ needs.docker.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.backend.result }}"  == "failure" ]] || \
             [[ "${{ needs.frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.docker.result }}"   == "failure" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI jobs passed"
