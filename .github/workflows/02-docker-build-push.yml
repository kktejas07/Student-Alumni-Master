# ═══════════════════════════════════════════════════════════════════════
# Docker Build & Push — GitHub Container Registry (GHCR)
# ═══════════════════════════════════════════════════════════════════════
# Builds and pushes multi-arch Docker images to GHCR.
# Triggered on push to main, dev, or manually.
# ═══════════════════════════════════════════════════════════════════════

name: Docker Build & Push

on:
  push:
    branches: [main, dev, develop, staging]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "Dockerfile*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Override image tag (default: git sha)"
        required: false
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image repository (GHCR requires lowercase)
        id: repo
        run: |
          REPO="${{ github.repository }}"
          REPO_LOWER="${REPO,,}"
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${REPO_LOWER}/frontend" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${REPO_LOWER}/backend" >> "$GITHUB_OUTPUT"

      - name: Generate tags
        id: tags
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            CUSTOM_TAG="${{ inputs.tag }}"
            echo "tag=$CUSTOM_TAG" >> "$GITHUB_OUTPUT"
            echo "sha_tag=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "sha_tag=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
            echo "sha_tag=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      # ─── Backend ────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.backend_image }}:${{ steps.tags.outputs.tag }}
            ${{ steps.repo.outputs.backend_image }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # ─── Frontend ───────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.frontend_image }}:${{ steps.tags.outputs.tag }}
            ${{ steps.repo.outputs.frontend_image }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # ─── Summary ────────────────────────────────────────────
      - name: Summary
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "| Image | Tags |"
            echo "|---|---|"
            echo "| Backend  | \`${{ steps.repo.outputs.backend_image }}:${{ steps.tags.outputs.tag }}\` |"
            echo "| Backend  | \`${{ steps.repo.outputs.backend_image }}:${{ steps.tags.outputs.sha_tag }}\` |"
            echo "| Frontend | \`${{ steps.repo.outputs.frontend_image }}:${{ steps.tags.outputs.tag }}\` |"
            echo "| Frontend | \`${{ steps.repo.outputs.frontend_image }}:${{ steps.tags.outputs.sha_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
