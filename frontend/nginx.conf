# ─────────────────────────────────────────────────────────────────
# Static SPA + JSON healthz, gzip + long cache for hashed assets.
# ─────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Useful for forwarded headers behind Dokploy / Traefik
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/xml+rss
        image/svg+xml application/wasm;

    # Tiny JSON for healthcheck (independent of JS shell)
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"studentalumni-frontend"}';
    }

    # Proxy uploaded files to the backend (coupons, ECHO media, etc.)
    # ^~ ensures prefix match beats the regex cache rule below.
    #
    # The backend host is injected at build time via the BACKEND_HOST build
    # arg (the Dokploy Swarm service name, e.g. student-alumni-backend-<id>).
    # Using a variable proxy_pass + the Docker embedded DNS resolver means
    # nginx STARTS even if the upstream is not resolvable yet, instead of
    # aborting at boot with "host not found in upstream". Unresolved requests
    # will 502 until BACKEND_HOST is set to the correct service name.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location ^~ /uploads/ {
        set $backend_upstream "${BACKEND_HOST}:8000";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1d;
    }

    # Cache static fingerprinted assets aggressively
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|webp|gif|svg|ico|map)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA history fallback — every other path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers — adjust CSP if you embed iframes / 3rd-party SDKs
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Allow Firebase Auth popups to close properly
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Disable nginx server token leakage
    server_tokens off;
}
