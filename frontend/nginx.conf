# ─────────────────────────────────────────────────────────────────
# Static SPA + JSON healthz, gzip + long cache for hashed assets.
# ─────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Useful for forwarded headers behind Dokploy / Traefik
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/xml+rss
        image/svg+xml application/wasm;

    # Tiny JSON for healthcheck (independent of JS shell)
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"studentalumni-frontend"}';
    }

    # Cache static fingerprinted assets aggressively
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|webp|gif|svg|ico|map)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA history fallback — every other path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers — adjust CSP if you embed iframes / 3rd-party SDKs
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Disable nginx server token leakage
    server_tokens off;
}
