[pytest]
# Enable pytest-asyncio for all async tests automatically.
# This fixes the ERRORs where async def fixtures/tests were not being handled.
asyncio_mode = auto

# Use a single event loop for the entire test session.
# Motor (AsyncIOMotorClient) is initialized at module load time and bound to
# one event loop. If pytest-asyncio creates a new loop per test (the default
# in 0.21+), Motor throws "RuntimeError: Event loop is closed" on subsequent
# tests. session-scoped loop keeps the Motor client alive correctly.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
    ignore::UserWarning

