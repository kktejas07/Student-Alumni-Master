document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 z-index: 1; max-width: 1400px; margin: 0 auto; padding: 26px 28px 90px;\">\n    <span class=\"rs-backblog\" style=\"display: inline-flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; border: 1px solid var(--line2); border-radius: 100px; padding: 10px 18px; background: var(--panel); cursor: pointer; transition: background .2s ease, filter .2s ease, transform .2s ease; margin-bottom: 26px;\">\n      <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: currentColor; stroke-width: 2;\"><path d=\"M20 12H5M11 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg>All posts\n    <\u002Fspan>\n\n    <div class=\"rs-r\" style=\"max-width: 780px;\">\n      <div style=\"display: flex; gap: 8px; margin-bottom: 20px;\">\n        <span style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: var(--tag-accent); background: var(--tint-strong); border: 1px solid var(--accent-line); border-radius: 7px; padding: 5px 10px;\">PLACEMENTS<\u002Fspan>\n        <span style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: var(--muted); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 10px;\">DATA STUDY<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size: 42px; font-weight: 700; letter-spacing: -1.8px; line-height: 1.12;\">What 12,400 student profiles tell us about the first job<\u002Fdiv>\n      <div style=\"font-size: 18px; line-height: 1.65; color: var(--muted); margin-top: 18px;\">Readiness scores rise fastest in the eight weeks after a student's first mentor session — not after their first application. We looked at why, and what it means for how colleges sequence placement prep.<\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 14px; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); flex-wrap: wrap;\">\n        <span style=\"width: 44px; height: 44px; border-radius: 50%; background: var(--violet); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: none;\">AK<\u002Fspan>\n        <div style=\"flex: 1; min-width: 0;\">\n          <div style=\"font-size: 14.5px; font-weight: 600;\">Aisha Kapoor<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--muted); margin-top: 2px;\">Head of Data · August 18, 2026 · 9 min read<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 9px; flex: none;\">\n          <span class=\"rs-ghostb\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 15px; cursor: pointer; transition: background .2s ease, filter .2s ease, transform .2s ease;\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: currentColor; stroke-width: 1.8;\"><circle cx=\"18\" cy=\"5.5\" r=\"2.6\"><\u002Fcircle><circle cx=\"6\" cy=\"12\" r=\"2.6\"><\u002Fcircle><circle cx=\"18\" cy=\"18.5\" r=\"2.6\"><\u002Fcircle><path d=\"M8.4 10.7l7.2-3.9M8.4 13.3l7.2 3.9\"><\u002Fpath><\u002Fsvg>Share\n          <\u002Fspan>\n          <span class=\"rs-ghostb\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 15px; cursor: pointer; transition: background .2s ease, filter .2s ease, transform .2s ease;\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: currentColor; stroke-width: 1.8;\"><path d=\"M6 4h12v17l-6-4.5L6 21Z\"><\u002Fpath><\u002Fsvg>Save\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"rs-r\" style=\"position: relative; overflow: hidden; border: 1px solid var(--accent-line); border-radius: 20px; background: linear-gradient(140deg, var(--tint-strong), var(--panel) 68%); padding: 30px 32px; margin-top: 30px;\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--violet-lt); margin-bottom: 22px;\">READINESS OVER 24 WEEKS · BY FIRST ACTION TAKEN<\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 900 260\" style=\"width: 100%; height: auto;\">\n        <g style=\"stroke: rgba(255,255,255,.07); stroke-width: 1;\"><path d=\"M40 220H880M40 165H880M40 110H880M40 55H880\"><\u002Fpath><\u002Fg>\n        <path id=\"rs-chart-b\" d=\"M40 214 L208 200 L376 186 L544 176 L712 168 L880 160\" sc-camel-path-length=\"1\" style=\"fill: none; stroke: #6A6A8E; stroke-width: 2.4; stroke-dasharray: 1; stroke-dashoffset: 1;\"><\u002Fpath>\n        <path id=\"rs-chart-a\" d=\"M40 214 L208 158 L376 108 L544 82 L712 66 L880 48\" sc-camel-path-length=\"1\" style=\"fill: none; stroke: #A78BFA; stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 1;\"><\u002Fpath>\n        <circle cx=\"880\" cy=\"48\" r=\"6\" fill=\"#FFFFFF\"><\u002Fcircle>\n        <g style=\"font-family: 'Outfit', sans-serif; font-size: 13px; fill: var(--muted);\">\n          <text x=\"40\" y=\"248\">Week 0<\u002Ftext><text x=\"376\" y=\"248\" text-anchor=\"middle\">Week 8<\u002Ftext><text x=\"712\" y=\"248\" text-anchor=\"middle\">Week 16<\u002Ftext><text x=\"880\" y=\"248\" text-anchor=\"end\">Week 24<\u002Ftext>\n        <\u002Fg>\n        <g style=\"font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600;\">\n          <text x=\"866\" y=\"36\" text-anchor=\"end\" fill=\"#C4B5FD\">Mentor session first · 74%<\u002Ftext>\n          <text x=\"866\" y=\"152\" text-anchor=\"end\" fill=\"#9A9AB4\">Application first · 43%<\u002Ftext>\n        <\u002Fg>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <div class=\"rs-r rs-legal\" style=\"display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; margin-top: 34px; align-items: start;\">\n      <div class=\"rs-jumpwrap\" style=\"position: sticky; top: 92px;\">\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.3px; color: var(--muted); margin-bottom: 14px;\">IN THIS ARTICLE<\u002Fdiv>\n        <span class=\"rs-jump\" data-target=\"po-0\" data-on=\"1\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">The pattern we did not expect<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"po-1\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">What the data actually shows<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"po-2\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">Why sequence matters<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"po-3\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">What we changed in the product<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"po-4\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">Method and limits<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"min-width: 0; max-width: 760px;\">\n        <div class=\"rs-sec\" id=\"po-0\" style=\"padding-bottom: 4px;\">\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">Every placement cell we work with sequences the same way. Resume workshop in week one, aptitude drills in week two, then applications open and students start firing. Mentorship, if it appears at all, arrives late — a panel in the final month, or a WhatsApp group nobody uses.<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">We had 12,400 verified student profiles across 42 institutions and two full placement cycles. We wanted to know whether that order was right. It is not.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"rs-sec\" id=\"po-1\" style=\"padding-bottom: 4px;\">\n        <div style=\"font-size: 24px; font-weight: 700; letter-spacing: -.7px; margin: 40px 0 16px;\">What the data actually shows<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">We split students by their first substantive action on the platform — booking a mentor session, or submitting a job application — and tracked readiness for 24 weeks after.<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">Students whose first action was a <strong style=\"color: var(--text); font-weight: 600;\">mentor session<\u002Fstrong> reached 74% average readiness by week 24. Students who applied first reached 43%. The gap opens in weeks 4 to 8 and never closes.<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">It is not selection bias in the obvious direction. The application-first group started with <strong style=\"color: var(--text); font-weight: 600;\">marginally higher<\u002Fstrong> average CGPA and marginally more prior internships. They were, on paper, the stronger cohort.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"rs-sec\" id=\"po-2\" style=\"padding-bottom: 4px;\">\n        <div style=\"font-size: 24px; font-weight: 700; letter-spacing: -.7px; margin: 40px 0 16px;\">Why sequence matters<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">Three mechanisms show up clearly in the session notes and the application logs.<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\"><strong style=\"color: var(--text); font-weight: 600;\">Rejection without feedback teaches nothing.<\u002Fstrong> A student who sends 40 applications and hears back from none has 40 data points and zero information. The same student after one mentor call knows their resume buries the only project a recruiter cares about.<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\"><strong style=\"color: var(--text); font-weight: 600;\">Mentors correct the target, not just the artefact.<\u002Fstrong> A third of first sessions end with the student changing the role they are aiming for. Applying first locks in a target chosen with no market information.<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\"><strong style=\"color: var(--text); font-weight: 600;\">Referrals compound and cold applications do not.<\u002Fstrong> A mentor who has met you once forwards your profile without being asked. Across the dataset, 61% of interviews traced back to a referral from someone the student had spoken to.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"rs-sec\" id=\"po-3\" style=\"padding-bottom: 4px;\">\n        <div style=\"font-size: 24px; font-weight: 700; letter-spacing: -.7px; margin: 40px 0 16px;\">What we changed in the product<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">We stopped showing the job board as the first thing on a new dashboard. Onboarding now ends on a suggested-mentors screen, and the roadmap's first milestone is a session rather than an application.<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">Agent K also holds back batch applications until a student has completed one session or explicitly overrides it. That override exists — we are not going to block someone who knows what they are doing — but it is a deliberate choice now, not the default path.<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">For placement cells we published a revised eight-week sequence: mentor matching in week one, target-setting in week two, resume work in week three against a target that now exists, and applications from week four.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"rs-sec\" id=\"po-4\" style=\"padding-bottom: 4px;\">\n        <div style=\"font-size: 24px; font-weight: 700; letter-spacing: -.7px; margin: 40px 0 16px;\">Method and limits<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">Observational data, not a randomised trial — students chose their own first action, and we cannot fully rule out that the kind of student who books a mentor call differs in ways we did not measure. Readiness is our own composite score, so it is not independent of the product.<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.8; color: var(--muted); margin-bottom: 22px;\">Two cycles is also not many. We will publish again after the 2027 cycle, and we will say so plainly if the effect shrinks. The anonymised, aggregated dataset is available to placement officers at partner institutions on request.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); padding: 22px 24px; margin-top: 40px; flex-wrap: wrap;\">\n          <span style=\"width: 52px; height: 52px; border-radius: 50%; background: var(--violet); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; flex: none;\">AK<\u002Fspan>\n          <div style=\"flex: 1; min-width: 0;\">\n            <div style=\"font-size: 15.5px; font-weight: 600;\">Aisha Kapoor<\u002Fdiv>\n            <div style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); margin-top: 4px;\">Head of Data at StudentAlumni. Previously placement analytics at a national education group.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"rs-r\" style=\"margin-top: 46px;\">\n      <div style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px; margin-bottom: 18px;\">Keep reading<\u002Fdiv>\n      <div class=\"rs-grid3\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px;\">\n        <div class=\"rs-card\" style=\"border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow); padding: 22px 24px 24px; cursor: pointer; transition: transform .25s cubic-bezier(.2,.8,.2,1);\">\n          <span style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: var(--sky); background: var(--sky-tint); border: 1px solid var(--sky-line); border-radius: 7px; padding: 5px 10px;\">MENTORSHIP<\u002Fspan>\n          <div style=\"font-size: 17px; font-weight: 700; letter-spacing: -.3px; line-height: 1.3; margin: 16px 0 9px;\">The three questions that make a mentor call useful<\u002Fdiv>\n          <div style=\"font-size: 12.5px; color: var(--dim);\">Aug 12, 2026 · 6 min read<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"rs-card\" style=\"border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow); padding: 22px 24px 24px; cursor: pointer; transition: transform .25s cubic-bezier(.2,.8,.2,1);\">\n          <span style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: var(--sky); background: var(--sky-tint); border: 1px solid var(--sky-line); border-radius: 7px; padding: 5px 10px;\">PLACEMENTS<\u00 r: var(--text); font-weight: 600;\">Marketing email<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Consent<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Consent, Art. 6(1)(a)<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Meeting tax and regulatory duties<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Legitimate use — law<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Legal obligation, Art. 6(1)(c)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">We do not sell personal data, and we do not share it for cross-context behavioural advertising. There is no automated decision that produces a legal effect on you: your readiness score and match percentages are advisory, always visible to you, and never the sole reason an application is rejected.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"pr-3\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">04<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Your rights in India — DPDP Act, 2023<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">As a <strong style=\"color: var(--text); font-weight: 600;\">Data Principal<\u002Fstrong> you may exercise the following at any time from Profile → Security → Your data, or by writing to our Grievance Officer. We respond within 30 days.<\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">Access<\u002Fstrong> (s.11) — a summary of the personal data we process and the identities we have shared it with.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">Correction and erasure<\u002Fstrong> (s.12) — correct inaccurate data, complete incomplete data, and have data erased once the purpose it was collected for is served.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">Grievance redressal<\u002Fstrong> (s.13) — raise a complaint with our Grievance Officer before approaching the Data Protection Board of India.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">Nomination<\u002Fstrong> (s.14) — nominate another person to exercise your rights in the event of your death or incapacity.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">Withdraw consent<\u002Fstrong> (s.6(4)) — as easily as it was given; we stop processing within a reasonable period.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 13px; border: 1px solid var(--accent-line); border-radius: 14px; background: rgba(124,92,252,.07); padding: 16px 18px; margin-bottom: 18px;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 1.9; margin-top: 3px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v.01M12 11v5\"><\u002Fpath><\u002Fsvg>\n          <div>\n            <div style=\"font-size: 14.5px; font-weight: 600; margin-bottom: 5px;\">Students under 18<\u002Fdiv>\n            <div style=\"font-size: 13.5px; line-height: 1.65; color: var(--muted);\">Under DPDP s.9 we require verifiable parental or guardian consent before processing the data of a child, and we do not undertake tracking, behavioural monitoring or targeted advertising directed at children. Age is checked at sign-up; where a college onboards a cohort, the institution warrants that it holds the necessary consents.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">You also have a duty under s.15 not to impersonate another person, suppress material information, or file a frivolous complaint.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"pr-4\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">05<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Your rights in the United States<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">There is no single federal privacy statute, so your rights depend on your state and on the kind of record involved. We apply the strongest applicable standard rather than the minimum.<\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">CCPA / CPRA (California)<\u002Fstrong> — know, access, delete, correct, portability, limit use of sensitive personal information, and opt out of sale or sharing. We do not sell or share as those terms are defined. No discrimination for exercising a right.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">Virginia, Colorado, Connecticut, Utah, Texas, Oregon, Montana and other state acts<\u002Fstrong> — access, correction, deletion, portability, opt-out of targeted advertising and profiling, and appeal of a refused request.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">FERPA<\u002Fstrong> — where a US institution engages us as a school official, education records are processed only under its direction, used solely for the purpose it authorised, and never redisclosed without consent.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">COPPA<\u002Fstrong> — we do not knowingly collect personal information from children under 13.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div><strong style=\"color: var(--text); font-weight: 600;\">Authorised agents<\u002Fstrong> — you may use an agent to make a request; we verify their authority and your identity.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">Requests go to privacy@studentalumni.ai. We confirm receipt within 10 days and substantively respond within 45 days, extendable once by a further 45 where reasonably necessary.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"pr-5\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">06<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Global transfers and other regions<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">Our primary data centres are in India (Mumbai) with a secondary region in Singapore. Where personal data moves out of its region of origin we rely on:<\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>GDPR Chapter V — the European Commission’s Standard Contractual Clauses, the UK International Data Transfer Addendum, and a transfer impact assessment per corridor.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>DPDP s.16 — transfers only to countries not restricted by the Central Government, subject to any notified conditions.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Sub-processors under written contract, audited annually, each listed with its location and purpose in our sub-processor register.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">If you are in Brazil (LGPD), Canada (PIPEDA), Australia (Privacy Act) or another jurisdiction with comparable rights, we honour access, correction, deletion and complaint rights on the same terms as above.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"pr-6\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">07<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">How long we keep it<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; margin-bottom: 20px;\">\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap: 14px; background: var(--panel2); padding: 13px 16px;\">\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">DATA<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">RETENTION<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">WHY<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Active account<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">While your account is open<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">To provide the service<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Closed account<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Deleted within 30 days<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">DPDP purpose limitation<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Payment records<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">8 financial years<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Indian tax and audit law<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Verification logs<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">3 years<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Fraud prevention, dispute resolution<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Support tickets<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">2 years<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Service quality and appeals<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Security event logs<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">12 months<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Incident investigation<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Aggregate analytics<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Indefinite, de-identified<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">No longer personal data<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"pr-7\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">08<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Changes and how to complain<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">We notify you in the product and by email at least 14 days before a material change takes effect, and keep every prior version available for download. Continuing to use the service after the effective date means you accept the revised policy.<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">If we have not resolved your concern, you may escalate to the <strong style=\"color: var(--text); font-weight: 600;\">Data Protection Board of India<\u002Fstrong>, to your EU or UK supervisory authority, to your state Attorney General in the US, or to the regulator in your own country. We will cooperate with any of them.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  \n          <div style=\"margin-top: 46px; padding-top: 40px; border-top: 1px solid var(--line);\">\n            <div style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; color: var(--violet-lt); background: var(--tint-strong); border-radius: 100px; padding: 7px 13px; margin-bottom: 18px;\">TERMS OF USE<\u002Fdiv>\n            <div style=\"max-width: 780px;\">\n      <div style=\"min-width: 0;\">\n      <div class=\"rs-sec\" id=\"tm-0\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">01<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Agreement and eligibility<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">By creating an account you accept these terms. If you are accepting on behalf of a college or company, you confirm you have authority to bind it.<\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>You must be at least 16 to hold an account in your own name; between 13 and 18 you need verifiable consent from a parent or guardian.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Student accounts require a verified college affiliation. Alumni accounts require proof of graduation.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>One account per person. Accounts are personal and may not be sold, shared or transferred.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"tm-1\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">02<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">What the service is — and is not<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">We provide tools: a career roadmap, mentor introductions, job and internship matching, event registration, verified identity and a rentals marketplace.<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 13px; border: 1px solid var(--accent-line); border-radius: 14px; background: rgba(124,92,252,.07); padding: 16px 18px; margin-bottom: 18px;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 1.9; margin-top: 3px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v.01M12 11v5\"><\u002Fpath><\u002Fsvg>\n          <div>\n            <div style=\"font-size: 14.5px; font-weight: 600; margin-bottom: 5px;\">No guarantee of outcome<\u002Fdiv>\n            <div style=\"font-size: 13.5px; line-height: 1.65; color: var(--muted);\">We do not promise a job, an internship, an interview, a referral, a specific salary, admission to any programme, or a particular readiness score. Match percentages and roadmaps are advisory estimates, not commitments by us or by any employer.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">Mentors are independent individuals, not our employees. Employers, colleges, event organisers and rental hosts are third parties. We verify identity and affiliation, but we do not underwrite the advice they give, the roles they post, or the property they list.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"tm-2\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">03<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Your responsibilities<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Keep your information accurate — particularly academic details, which others rely on.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Keep your credentials secure and tell us promptly if you suspect misuse.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Do not impersonate anyone, misstate your qualifications, or forge a verification document.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Do not scrape, crawl, resell or bulk-export data about other users, or use the platform to recruit for a competing service.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Do not upload malware, attempt to breach our systems, or probe them without written permission.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Respect the community code of conduct in every space we operate.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">We may suspend or terminate an account that breaches these terms. Where the breach is not severe we give notice and a chance to fix it first; for fraud, harassment or a security attack, suspension is immediate.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"tm-3\" style=\"borde
