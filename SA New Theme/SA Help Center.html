s for a particular purpose and non-infringement.<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">Neither party is liable for indirect, incidental, special or consequential loss, or for loss of profit, revenue, data or opportunity. Our total aggregate liability to you is limited to the greater of the amount you paid us in the 12 months before the claim, or INR 5,000.<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 13px; border: 1px solid var(--accent-line); border-radius: 14px; background: rgba(124,92,252,.07); padding: 16px 18px; margin-bottom: 18px;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 1.9; margin-top: 3px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v.01M12 11v5\"><\u002Fpath><\u002Fsvg>\n          <div>\n            <div style=\"font-size: 14.5px; font-weight: 600; margin-bottom: 5px;\">What we never exclude<\u002Fdiv>\n            <div style=\"font-size: 13.5px; line-height: 1.65; color: var(--muted);\">Nothing in these terms limits liability for death or personal injury caused by negligence, for fraud, or for anything else that cannot lawfully be limited — including your non-waivable statutory rights as a consumer.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"tm-6\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">07<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Suspension, termination and survival<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">You may close your account at any time from Profile → Security. We may terminate on 30 days’ notice, or immediately for a serious breach. On termination your right to use the service stops, and we delete your data as described in the Privacy Policy.<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">Provisions that by their nature should survive — content licences already granted to recipients, liability limits, payment obligations already incurred, and dispute resolution — continue after termination.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"tm-7\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">08<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Governing law and disputes<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">These terms are governed by the laws of India, and the courts at Hyderabad, Telangana have exclusive jurisdiction — except that if you are a consumer resident in the EU, UK or a US state, you keep the right to bring proceedings in your local courts under your local law.<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">Before litigation, both sides agree to try to resolve the dispute in good faith within 30 days of written notice. We do not require you to waive any right to a class action or jury trial where that waiver is unenforceable in your jurisdiction.<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">Questions about these terms: legal@studentalumni.ai<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  \n          <\u002Fdiv><\u002Fdiv>\n\n  \n\n  <div id=\"rs-page-security\" class=\"rs-page\" style=\"display: none; position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 34px 28px 90px;\">\n    <div class=\"rs-r\" style=\"max-width: 780px;\">\n      <span style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--tag-ok); background: var(--ok-tint); border-radius: 100px; padding: 7px 14px;\">LEGAL · SECURITY &amp; COOKIES<\u002Fspan>\n      <div style=\"font-size: 40px; font-weight: 700; letter-spacing: -1.6px; margin: 20px 0 12px;\">Security &amp; Cookies<\u002Fdiv>\n      <div style=\"font-size: 16px; line-height: 1.65; color: var(--muted);\">How student data is protected in practice — the controls, the frameworks we measure against, and what happens in the first hours of an incident.<\u002Fdiv>\n      <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px;\">\n        <span style=\"font-size: 12.5px; color: var(--muted); border: 1px solid var(--line2); border-radius: 100px; padding: 7px 14px;\">Version 3.0<\u002Fspan>\n        <span style=\"font-size: 12.5px; color: var(--muted); border: 1px solid var(--line2); border-radius: 100px; padding: 7px 14px;\">Effective August 22, 2026<\u002Fspan>\n        <span class=\"rs-ghostb\" style=\"font-size: 12.5px; font-weight: 600; border: 1px solid var(--line2); border-radius: 100px; padding: 7px 14px; cursor: pointer; transition: background .2s ease, filter .2s ease, transform .2s ease;\">Download PDF<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"rs-r\" style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 13px; border: 1px solid var(--warn-line); border-radius: 14px; background: rgba(245,179,66,.07); padding: 16px 18px; margin-top: 22px; max-width: 780px;\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--amber); stroke-width: 1.9; margin-top: 3px;\"><path d=\"M12 3l9 16H3Z\"><\u002Fpath><path d=\"M12 9v4.5M12 16.5v.01\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-size: 13.5px; line-height: 1.65; color: var(--muted);\">This is a drafting template written to reflect the obligations named below. It has not been reviewed by counsel — have a qualified lawyer in each jurisdiction you operate in review and adapt it before you publish.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"rs-r rs-legal\" style=\"display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; margin-top: 30px; align-items: start;\">\n      <div class=\"rs-jumpwrap\" style=\"position: sticky; top: 92px;\">\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.3px; color: var(--muted); margin-bottom: 14px;\">ON THIS PAGE<\u002Fdiv>\n        <span class=\"rs-jump\" data-target=\"sc-0\" data-on=\"1\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">Frameworks we are measured against<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"sc-1\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">Encryption and key management<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"sc-2\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">Access control<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"sc-3\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">Infrastructure and resilience<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"sc-4\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">Testing and assurance<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"sc-5\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">Incident response and breach notification<\u002Fspan>\n        <span class=\"rs-jump\" data-target=\"sc-6\" style=\"display: block; font-size: 13.5px; line-height: 1.45; color: var(--muted); border-left: 2px solid var(--line2); padding: 9px 0 9px 14px; cursor: pointer; transition: color .2s ease, border-color .2s ease;\">Report a vulnerability<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"min-width: 0;\">\n      <div class=\"rs-sec\" id=\"sc-0\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">01<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Frameworks we are measured against<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">We do not invent our own standard. Our control set is mapped to recognised frameworks so it can be audited by someone other than us.<\u002Fdiv>\n        <div style=\"border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; margin-bottom: 20px;\">\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr); gap: 14px; background: var(--panel2); padding: 13px 16px;\">\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">FRAMEWORK<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">SCOPE<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">STATUS<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">ISO/IEC 27001:2022<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Information security management system<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Certified<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">SOC 2 Type II<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Security, availability and confidentiality<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Annual report<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">NIST CSF 2.0<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Govern, identify, protect, detect, respond, recover<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Mapped<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">NIST SP 800-171<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Protecting controlled unclassified information<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Aligned<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">PCI DSS<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Card data — handled entirely by Razorpay<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Out of scope by design<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">CIS Benchmarks<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Cloud and OS hardening baselines<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Enforced<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">DPDP Act s.8(5)<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Reasonable security safeguards<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Compliant<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,.8fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">GDPR Art. 32<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Security of processing<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Compliant<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"sc-1\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">02<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Encryption and key management<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>TLS 1.3 for all data in transit, with HSTS preload and modern ciphers only. TLS 1.0 and 1.1 are disabled.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>AES-256 at rest for databases, object storage, backups and log archives.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Aadhaar numbers, government identifiers and payment references are encrypted at the field level with a separate key, and masked in every interface and log.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Keys live in a managed HSM-backed key service, rotated annually and on any suspected compromise. No engineer holds a production data key.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Passwords are hashed with Argon2id. We never store, log or email a plaintext password.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"sc-2\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">03<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Access control<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Least privilege by default, granted by role and reviewed quarterly. Access to production data requires a named business reason.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Mandatory multi-factor authentication and SSO for every internal account.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Just-in-time, time-boxed production access with session recording; standing access is not granted.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Full audit trail of who read or changed which record, retained 12 months and queryable by our compliance team.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Access is revoked within one hour of an employee or contractor leaving.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"sc-3\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">04<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Infrastructure and resilience<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Segmented private networks, no public database endpoints, and a WAF plus rate limiting at the edge.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Primary region in Mumbai with a secondary in Singapore. Encrypted backups every 6 hours, retained 35 days, restore-tested quarterly.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Recovery objectives: RPO 6 hours, RTO 4 hours.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Infrastructure as code with peer-reviewed changes; no manual production edits.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Continuous vulnerability scanning of dependencies, images and hosts, with a defined patch window by severity.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; margin-bottom: 20px;\">\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr); gap: 14px; background: var(--panel2); padding: 13px 16px;\">\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">SEVERITY<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">TRIAGE<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">PATCH TARGET<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Critical<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Within 2 hours<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">24 hours<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">High<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Within 8 hours<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">7 days<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Medium<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Within 3 days<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">30 days<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Low<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Next cycle<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">90 days<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"sc-4\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">05<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Testing and assurance<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Independent third-party penetration test at least annually, plus a retest of every finding.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Automated SAST, DAST and dependency scanning in continuous integration; a failing security gate blocks the release.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Threat modelling for any feature touching identity, payments or documents.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Annual security training for all staff, with phishing simulations quarterly.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Every sub-processor is security-reviewed before onboarding and re-reviewed annually.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"sc-5\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">06<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Incident response and breach notification<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">We run a documented incident response plan with a named on-call commander, and we rehearse it twice a year. Our notification clocks are set to the strictest applicable law rather than the most convenient.<\u002Fdiv>\n        <div style=\"border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; margin-bottom: 20px;\">\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap: 14px; background: var(--panel2); padding: 13px 16px;\">\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">OBLIGATION<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">WHO WE TELL<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted);\">DEADLINE<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">DPDP s.8(6), India<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Data Protection Board and every affected Data Principal<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Without delay, per Board rules<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">CERT-In directions<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Indian Computer Emergency Response Team<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">6 hours of detection<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">GDPR Art. 33<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Lead supervisory authority<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">72 hours<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">GDPR Art. 34<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Affected data subjects, where high risk<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Without undue delay<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">US state breach laws<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Residents and Attorneys General as required<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">30–60 days by state<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">FERPA<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">The institution, as controller<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Immediately<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"rs-trow\" style=\"display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap: 14px; border-top: 1px solid var(--line); padding: 14px 16px;\">\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--text); font-weight: 600;\">Contractual<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">Enterprise and college customers<\u002Fspan>\n            <span style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); font-weight: 400;\">24 hours<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">Our notice states what happened, which categories of data were involved, what we have done, what you should do, and who to contact. We publish a post-incident report for any event affecting more than 100 people.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"sc-6\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">07<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Report a vulnerability<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">If you have found a security issue, tell us before you tell anyone else and we will work with you.<\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Write to security@studentalumni.ai. We acknowledge within 4 hours and give a substantive response within 72 hours.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>We will not pursue legal action against good-faith research that respects user privacy, avoids service degradation, and does not exfiltrate or retain data.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Please give us 90 days before public disclosure, or less if we fix it sooner.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Valid reports are credited in our researcher acknowledgements, and eligible ones earn a bounty.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 13px; border: 1px solid var(--accent-line); border-radius: 14px; background: rgba(124,92,252,.07); padding: 16px 18px; margin-bottom: 18px;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 1.9; margin-top: 3px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v.01M12 11v5\"><\u002Fpath><\u002Fsvg>\n          <div>\n            <div style=\"font-size: 14.5px; font-weight: 600; margin-bottom: 5px;\">Out of scope<\u002Fdiv>\n            <div style=\"font-size: 13.5px; line-height: 1.65; color: var(--muted);\">Denial of service, social engineering of our staff or users, physical attacks, spam or best-practice reports with no demonstrated impact, and findings from automated scanners without a working proof of concept.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  \n          <div style=\"margin-top: 46px; padding-top: 40px; border-top: 1px solid var(--line);\">\n            <div style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; color: var(--violet-lt); background: var(--tint-strong); border-radius: 100px; padding: 7px 13px; margin-bottom: 18px;\">COOKIE POLICY<\u002Fdiv>\n            <div style=\"max-width: 780px;\">\n      <div style=\"min-width: 0;\">\n      <div class=\"rs-sec\" id=\"ck-0\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">01<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">How we treat consent<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">Only strictly necessary cookies are set before you choose. Everything else — analytics, preferences, any future marketing — waits for your consent, and withdrawing it is exactly as easy as giving it.<\u002Fdiv>\n        <div style=\"display: grid; gap: 11px; margin-bottom: 18px;\">\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>No pre-ticked boxes, and Reject is as prominent as Accept.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>Your choice is recorded with a timestamp and honoured across devices once you sign in.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>We re-ask after 12 months, or sooner if we add a new purpose.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; font-size: 14.5px; line-height: 1.7; color: var(--muted);\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" style=\"fill: none; stroke: var(--violet-lt); stroke-width: 2.2; margin-top: 5px;\"><path d=\"M5 12.5l4 4 9-9.5\"><\u002Fpath><\u002Fsvg>\n            <div>We respect Global Privacy Control and Do Not Track signals as an opt-out of non-essential cookies.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.75; color: var(--muted); margin-bottom: 16px;\">This satisfies GDPR Art. 7 and the ePrivacy Directive, consent under India’s DPDP Act, and the opt-out requirements of CPRA and the other US state privacy acts.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rs-sec\" id=\"ck-1\" style=\"border-top: 1px solid var(--line); padding: 30px 0 4px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;\">\n          <span style=\"font-size: 12px; font-weight: 700; color: var(--dim); flex: none;\">02<\u002Fspan>\n          <span style=\"font-size: 21px; font-weight: 700; letter-spacing: -.5px;\">Manage your preferences<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 12px; margin-bottom: 20px;\">\n          <div class=\"rs-tgl rs-locked\" data-on=\"1\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 18px; align-items: center; border: 1px solid var(--line2); border-radius: 14px; backgrou    tagOk: '#34D399', tagWarn: '#F5B342', tagAccent: '#A78BFA', tagDanger: '#F58C8C',\n        shadow: '0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px rgba(0,0,0,.35)',\n        curtain: '#07070E', glow: '.55'\n      },\n      light: {\n        bg: '#F4F5FA', panel: '#FFFFFF', panel2: '#F3F4FA', line: '#E4E6F0', line2: '#D9DCEA',\n        text: '#141726', muted: '#565B70', dim: '#6B7080',\n        violet: '#6A4FE0', violetLt: '#5B4FE9', accentLine: '#D6D2FA',\n        tint: 'rgba(106,79,224,.07)', tintStrong: 'rgba(106,79,224,.13)',\n        onAccent: '#FFFFFF', onTint: '#3B2FA8', chrome: 'rgba(244,245,250,.88)',\n        ok: '#047857', okTint: 'rgba(4,120,87,.07)', okLine: '#A7E3C8',\n        amber: '#B45309', warnTint: 'rgba(180,83,9,.07)', warnLine: '#F1D2A5',\n        sky: '#0E6E8C', skyTint: 'rgba(14,110,140,.07)', skyLine: '#A8D4E4',\n        // tinted 10.5px/700 tags need darker ink than the semantic colour to clear 4.5:1 on their own fill\n        tagOk: '#02543C', tagWarn: '#7C3907', tagAccent: '#3B2FA8', tagDanger: '#9F0F32',\n        shadow: '0 1px 2px rgba(20,23,38,.04), 0 12px 30px rgba(20,23,38,.06)',\n        curtain: '#0B0B16', glow: '.32'\n      }\n    };\n    const applyTheme = (name) => {\n      const T = themes[name] || themes.dark;\n      const vars = {\n        '--bg': T.bg, '--panel': T.panel, '--panel2': T.panel2, '--line': T.line, '--line2': T.line2,\n        '--text': T.text, '--muted': T.muted, '--dim': T.dim,\n        // the theme's own violet wins unless the user genuinely overrode the accent\n        '--violet': (this.props.accent && this.props.accent !== '#7C5CFC') ? this.props.accent : T.violet,\n        '--violet-lt': T.violetLt, '--accent-line': T.accentLine,\n        '--tint': T.tint, '--tint-strong': T.tintStrong,\n        '--on-accent': T.onAccent, '--on-tint': T.onTint, '--chrome': T.chrome,\n        '--ok': T.ok, '--ok-tint': T.okTint, '--ok-line': T.okLine,\n        '--amber': T.amber, '--warn-tint': T.warnTint, '--warn-line': T.warnLine,\n        '--sky': T.sky, '--sky-tint': T.skyTint, '--sky-line': T.skyLine,\n        '--tag-ok': T.tagOk, '--tag-warn': T.tagWarn, '--tag-accent': T.tagAccent, '--tag-danger': T.tagDanger,\n        '--shadow': T.shadow\n      };\n      Object.keys(vars).forEach((k) => root.style.setProperty(k, vars[k]));\n      root.style.background = T.bg;\n      root.style.color = T.text;\n      document.documentElement.style.background = T.bg;\n      if (document.body) document.body.style.background = T.bg;\n      const cur = document.getElementById('rs-curtain');\n      if (cur) cur.style.background = T.curtain;\n      const fx = root.firstElementChild;\n      if (fx) fx.style.opacity = T.glow;\n      const ico = document.getElementById('rs-theme-ico');\n      if (ico) ico.innerHTML = name === 'light'\n        ? '<circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 3v2M12 19v2M3 12h2M19 12h2M6 6l1.4 1.4M16.6 16.6L18 18M18 6l-1.4 1.4M7.4 16.6L6 18\"><\u002Fpath>'\n        : '<path d=\"M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5Z\"><\u002Fpath>';\n      this.theme = name;\n    };\n    applyTheme(this.props.theme === 'Light' ? 'light' : 'dark');\n    const tBtn = document.getElementById('rs-theme');\n    if (tBtn) tBtn.addEventListener('click', () => applyTheme(this.theme === 'light' ? 'dark' : 'light'));\n\n    // swap the visible page and replay its entrance\n    const swap = (key) => {\n      root.querySelectorAll('.rs-page').forEach((p) => { p.style.display = p.id === 'rs-page-' + key ? 'block' : 'none'; });\n      root.querySelectorAll('.rs-nav').forEach((n) => {\n        const on = n.dataset.page === key || (key === 'post' && n.dataset.page === 'blog');\n        if (on) n.dataset.on = '1'; else delete n.dataset.on;\n      });\n      window.scrollTo(0, 0);\n      const page = document.getElementById('rs-page-' + key);\n      if (page && !reduced) {\n        Array.prototype.slice.call(page.querySelectorAll('.rs-r')).forEach((el, i) => {\n yle.transition = 'clip-path .5s cubic-bezier(.76,0,.24,1)';\n      curtain.style.clipPath = 'inset(0% 0 0 0)';\n      if (cMark) {\n        cMark.style.transition = 'opacity .45s ease .1s, transform .75s cubic-bezier(.2,.9,.3,1) .1s';\n        cMark.style.opacity = '1';\n        cMark.style.transform = 'scale(1)';\n      }\n      // tagline then hashtag rise out of their clipping masks, staggered behind the mark\n      [[cTag, 0.3], [cHash, 0.42]].forEach(([el, d]) => {\n        if (!el) return;\n        const inner = el.firstElementChild;\n        if (inner) inner.style.animation = 'rs-wordup .62s cubic-bezier(.2,.8,.2,1) both ' + d + 's';\n      });\n      if (cBar) { cBar.style.transition = 'width .82s cubic-bezier(.3,.7,.2,1) .12s'; cBar.style.width = '100%'; }\n\n      // 2 — counter runs while it is closed\n      const t0 = performance.now();\n      const tick = (t) => {\n        const p = Math.min(1, (t - t0) / 900);\n        if (cNum) cNum.textContent = String(Math.round(p * 100)).padStart(2, '0');\n        if (p < 1) this.craf = requestAnimationFrame(tick);\n      };\n      this.craf = requestAnimationFrame(tick);\n\n      // 3 — swap behind the curtain\n      this.timers.push(setTimeout(() => swap(key), 560));\n\n      // 4 — curtain leaves upward, revealing the new page\n      this.timers.push(setTimeout(() => {\n        if (cNum) cNum.textContent = '100';\n        curtain.style.transition = 'clip-path .6s cubic-bezier(.76,0,.24,1)';\n        curtain.style.clipPath = 'inset(0 0 100% 0)';\n      }, 1040));\n      this.timers.push(setTimeout(() => {\n        curtain.style.visibility = 'hidden';\n        curtain.style.opacity = '0';\n        routing = false;\n      }, 1660));\n    };\n    this.go = go;\n    // footer links are the only route into the resource pages now\n    root.querySelectorAll('.rs-flink').forEach((n) => n.addEventListener('click', () => go(n.dataset.page)));\n    // header carries the main site nav — selection only, no resource routing\n    // cross-file links replay the curtain before navigating\n    root.querySelectorAll('a[href*=\".dc.html\"]').forEach((a) => a.addEventListener('click', (e) => {\n      const href = a.getAttribute('href');\n      if (!href || a.dataset.exiting) return;\n      e.preventDefault();\n      root.querySelectorAll('.rs-mainnav').forEach((o) => { if (o === a) o.dataset.on = '1'; else delete o.dataset.on; });\n      if (!curtain || reduced) { window.location.href = href; return; }\n      a.dataset.exiting = '1';\n      curtain.style.setProperty('display', 'flex', 'important');\n      curtain.style.setProperty('transform', 'translateY(0)', 'important');\n      curtain.style.setProperty('opacity', '1', 'important');\n      curtain.style.pointerEvents = 'auto';\n      const t0 = performance.now();\n      const step = (t) => {\n        const pr = Math.min(1, (t - t0) / 780);\n        const eo = 1 - Math.pow(1 - pr, 3);\n        if (cNum) cNum.textContent = String(Math.round(eo * 100)).padStart(2, '0');\n        if (cBar) cBar.style.width = (eo * 100).toFixed(1) + '%';\n        if (pr < 1) requestAnimationFrame(step);\n      };\n      requestAnimationFrame(step);\n      setTimeout(() => { window.location.href = href; }, 840);\n    }));\n    root.querySelectorAll('.rs-openpost').forEach((c) => c.addEventListener('click', () => go('post')));\n    root.querySelectorAll('.rs-backblog').forEach((b) => b.addEventListener('click', () => go('blog')));\n\n    // article chart draws its two lines, then rests drawn\n    this.drawChart = (scope) => {\n      ['rs-chart-b', 'rs-chart-a'].forEach((id, i) => {\n        const el = scope.querySelector('#' + id);\n        if (!el) return;\n        el.style.transition = 'none';\n        el.style.strokeDashoffset = '1';\n        void el.getBoundingClientRect();\n        el.style.transition = reduced ? 'none' : 'stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1) ' + (i * 0.18) + 's';\n        const fin = () => { el.style.strokeDashoffset = '0'; };\n        requestAnimationFrame(fin);\n        this.timers.push(setTimeout(fin, 300));\n      });\n    };\n\n    // counters rest at their final value\n    this.count = (scope) => {\n      Array.prototype.slice.call(scope.querySelectorAll('.rs-num')).forEach((el) => {\n        const target = parseFloat(el.dataset.to);\n        if (reduced || !target) { el.textContent = target.toLocaleString('en-IN'); return; }\n        const t0 = performance.now();\n        const step = (t) => {\n          const p = Math.min(1, (t - t0) / 1000);\n          el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString('en-IN');\n          if (p < 1) requestAnimationFrame(step); else el.textContent = target.toLocaleString('en-IN');\n        };\n        requestAnimationFrame(step);\n        this.timers.push(setTimeout(() => { el.textContent = target.toLocaleString('en-IN'); }, 1200));\n      });\n    };\n\n    this.wire();\n\n    const responsive = () => {\n      const w = root.getBoundingClientRect().width;\n      const narrow = w < 1150, tight = w < 860;\n      root.querySelectorAll('.rs-grid3').forEach((g) => { g.style.gridTemplateColumns = tight ? '1fr' : narrow ? 'repeat(2, minmax(0, 1fr))' : 'repeat(3, minmax(0, 1fr))'; });\n      root.querySelectorAll('.rs-grid4').forEach((g) => { g.style.gridTemplateColumns = tight ? 'repeat(2, minmax(0, 1fr))' : narrow ? 'repeat(2, minmax(0, 1fr))' : 'repeat(4, minmax(0, 1fr))'; });\n      root.querySelectorAll('.rs-grid2').forEach((g) => { g.style.gridTemplateColumns = tight ? '1fr' : 'repeat(2, minmax(0, 1fr))'; });\n      root.querySelectorAll('.rs-feat').forEach((g) => { g.style.gridTemplateColumns = narrow ? '1fr' : 'minmax(0, 1.2fr) minmax(0, 1fr)'; });\n      root.querySelectorAll('.rs-help2').forEach((g) => { g.style.gridTemplateColumns = narrow ? '1fr' : 'minmax(0, 1fr) 380px'; });\n      root.querySelectorAll('.rs-legal').forEach((g) => { g.style.gridTemplateColumns = narrow ? '1fr' : '250px minmax(0, 1fr)'; });\n      root.querySelectorAll('.rs-jumpwrap').forEach((g) => { g.style.position = narrow ? 'static' : 'sticky'; });\n      root.querySelectorAll('.rs-fgrid').forEach((g) => { g.style.gridTemplateColumns = w < 720 ? 'minmax(0, 1fr)' : w < 1040 ? 'repeat(2, minmax(0, 1fr))' : 'minmax(0, 1.5fr) repeat(3, minmax(0, 1fr))'; });\n      root.querySelectorAll('#rs-consent-bar').forEach((b) => { b.style.gridTemplateColumns = w < 900 ? 'minmax(0, 1fr)' : 'max-content minmax(0, 1fr) max-content'; b.style.textAlign = w < 900 ? 'left' : 'inherit'; });\n      root.querySelectorAll('.rs-foot').forEach((g) => { g.style.gridTemplateColumns = tight ? '1fr' : narrow ? 'repeat(2, minmax(0, 1fr))' : 'minmax(0, 1.4fr) repeat(3, minmax(0, 1fr))'; });\n      root.querySelectorAll('.rs-sub').forEach((g) => { g.style.gridTemplateColumns = narrow ? 'minmax(0, 1fr)' : 'minmax(0, 1fr) max-content'; });\n      root.querySelectorAll('.rs-hashmark').forEach((g) => { g.style.fontSize = tight ? '32px' : narrow ? '42px' : '52px'; });\n      root.querySelectorAll('.rs-lighthero').forEach((g) => {\n        g.style.gridTemplateColumns = narrow ? 'minmax(0, 1fr)' : 'minmax(0, 1fr) minmax(0, 1.05fr)';\n        g.style.padding = tight ? '30px 24px' : '48px 46px';\n        g.style.gap = narrow ? '32px' : '44px';\n      });\n      const strip = document.getElementById('rs-navstrip');\n      if (strip) strip.querySelectorAll('.rs-nav, .rs-mainnav').forEach((n) => { n.style.padding = tight ? '0 10px' : '0 13px'; n.style.fontSize = tight ? '12.5px' : '13.5px'; });\n      root.querySelectorAll('.rs-subrow').forEach((g) => { g.style.flexDirection = tight ? 'column' : 'row'; g.style.alignItems = tight ? 'stretch' : 'center'; });\n      // curtain type scales down so the hashtag never clips on a narrow viewport\n      const hash = document.getElementById('rs-curtain-hash');\n      if (hash && hash.firstElementChild) hash.firstElementChild.style.fontSize = tight ? '34px' : narrow ? '48px' : '62px';\n      const tag = document.g bel) => {\n      try { localStorage.setItem(CKEY, JSON.stringify({ ...state, at: Date.now() })); } catch (e) {}\n      closePrefs();\n      hideBar();\n      if (label) {\n        const save = document.getElementById('rs-prefs-savelabel');\n        if (save) { save.textContent = label; this.timers.push(setTimeout(() => { save.textContent = 'Save my choices'; }, 1600)); }\n      }\n    };\n    const acceptAll = () => { setAll(true); commit(); };\n    const rejectAll = () => { setAll(false); commit(); };\n    [['rs-c-accept', acceptAll], ['rs-c-reject', rejectAll], ['rs-c-custom', openPrefs],\n     ['rs-prefs-save', () => commit('Saved \\u2713')], ['rs-prefs-reject', rejectAll], ['rs-prefs-x', closePrefs]]\n      .forEach(([id, fn]) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); });\n    if (prefs) prefs.addEventListener('click', (e) => { if (e.target === prefs) closePrefs(); });\n    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && prefs && prefs.style.display === 'flex') closePrefs(); });\n    // honour Global Privacy Control rather than asking\n    const gpc = navigator.globalPrivacyControl === true || navigator.doNotTrack === '1';\n    const saved = readC();\n    if (saved) { ['analytics', 'functional', 'marketing'].forEach((k) => { state[k] = !!saved[k]; }); paintAll(); }\n    else if (gpc) { setAll(false); commit(); }\n    else this.timers.push(setTimeout(showBar, 1200));\n    root.querySelectorAll('.rs-art').forEach((a) => {\n      if ((a.textContent || '').indexOf('Manage cookie preferences') > -1) a.addEventListener('click', openPrefs);\n    });\n\n    // cookie toggles\n    root.querySelectorAll('.rs-tgl').forEach((t) => {\n      if (t.classList.contains('rs-locked')) return;\n      t.addEventListener('click', () => {\n        const on = !t.dataset.on;\n        t.dataset.on = on ? '1' : '';\n        const track = t.querySelector('.rs-tgl-track');\n        const knob = t.querySelector('.rs-tgl-kno
